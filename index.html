  <div id="viewport">
    <div id="device">
      <div id="bezel">
        <div id="screen" data-accent="blue">
          <div id="nbt" class="system"></div>
          <div id="carplay" class="system" hidden></div>
          <div id="dimmer"></div>
        </div>
      </div>

      <!-- Physical keys below the screen -->
      <nav id="hardkeys" aria-label="Hardware keys">
        <button data-key="back">BACK</button>
        <button data-key="menu">MENU</button>
        <button data-key="media">MEDIA</button>
        <button data-key="nav">NAV</button>
        <button data-key="tel">TEL</button>
        <span class="hk-gap"></span>
        <button data-key="voldown" aria-label="Volume down" class="hk-ic"><svg class="ic"><use href="#i-minus"/></svg></button>
        <button data-key="mute" aria-label="Mute" class="hk-ic hk-knob"><svg class="ic"><use href="#i-vol"/></svg></button>
        <button data-key="volup" aria-label="Volume up" class="hk-ic"><svg class="ic"><use href="#i-plus"/></svg></button>
      </nav>
    </div>
  </div>
